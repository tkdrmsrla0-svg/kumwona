<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>금원아의 내일</title>

<!-- iOS 홈화면 추가용 PWA 메타 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="금원아의 내일">
<meta name="theme-color" content="#17111C">

<!-- 홈화면 앱 아이콘 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  :root{
    --bg:#17111C; --bg2:#1F1726; --card:#241B2E; --card2:#2B2036;
    --line:rgba(255,255,255,.07);
    --wine:#4B1528; --wine2:#5A1B33;
    --rose:#F4789F; --rose-soft:#FFB3C9; --rose-glow:rgba(244,120,159,.35);
    --gold:#E8C9A0;
    --text:#F4ECF1; --muted:#A892A0; --muted2:#7A6776;
    --p1:#F7C9D3; --p2:#DDCBF2; --p3:#BFE8D8; --p4:#FBD7BE; --p5:#C5E2F5; --p6:#F5E9C8;
    --serif:'Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:var(--sans); color:var(--text);
    background:
      radial-gradient(120% 80% at 80% -10%, rgba(244,120,159,.13), transparent 55%),
      radial-gradient(100% 60% at -10% 10%, rgba(221,203,242,.08), transparent 50%),
      var(--bg);
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .wrap{max-width:440px;margin:0 auto;padding:0 20px 140px;}
  .pt-safe{padding-top:calc(env(safe-area-inset-top) + 18px);}

  /* ---------- 헤더 ---------- */
  .gift-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--rose),#ff9ebd);
    color:#3a0e1f;font-weight:700;font-size:12px;letter-spacing:.2px;
    padding:7px 14px;border-radius:999px;
    box-shadow:0 8px 22px var(--rose-glow);
    animation:floatTag 3.5s ease-in-out infinite;
  }
  @keyframes floatTag{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .header{margin-top:18px;}
  .brand{
    font-family:var(--serif);font-weight:800;font-size:34px;letter-spacing:-1px;
    line-height:1.1;background:linear-gradient(120deg,#fff 30%,var(--rose-soft));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand .sub{font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:500;letter-spacing:0;-webkit-text-fill-color:var(--muted);}
  .datebar{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .datebar .ico{font-size:15px}
  .date-input{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    font-family:var(--sans);font-size:14px;font-weight:600;
    padding:9px 12px;border-radius:12px;color-scheme:dark;
  }

  /* ---------- 섹션 ---------- */
  .sec{margin-top:26px;}
  .sec-h{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .sec-h .emo{font-size:17px}
  .sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.2px;}
  .sec-h .tag{margin-left:auto;font-size:11px;color:var(--muted2);font-weight:600;}

  .field{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;
  }
  .field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:7px;letter-spacing:.2px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;margin-bottom:0;}
  input.txt, textarea.txt{
    width:100%;background:transparent;border:none;outline:none;
    color:var(--text);font-family:var(--sans);font-size:15px;font-weight:500;resize:none;line-height:1.5;
  }
  input.txt::placeholder, textarea.txt::placeholder{color:var(--muted2);font-weight:400;}
  input[type=time].txt{color-scheme:dark;}

  /* ---------- MUST 3 (동그라미 히어로) ---------- */
  .must-wrap{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .must{flex:1;display:flex;flex-direction:column;align-items:center;}
  .circle{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 -8px 18px rgba(0,0,0,.12);
  }
  .must:nth-child(1) .circle{background:radial-gradient(120% 120% at 30% 25%,#fff 0%,var(--p1) 55%,#eaa9bb 100%);}
  .must:nth-child(2) .circle{background:radial-gradient(120% 120% at 30% 25%,#fff 0%,var(--p2) 55%,#b9a3e0 100%);}
  .must:nth-child(3) .circle{background:radial-gradient(120% 120% at 30% 25%,#fff 0%,var(--p3) 55%,#9cd6bf 100%);}
  .circle .num{font-family:var(--serif);font-weight:800;font-size:30px;color:var(--wine);opacity:.85;}
  .circle:active{transform:scale(.94);}
  .circle .check{
    position:absolute;inset:0;border-radius:50%;
    background:rgba(36,18,28,.78);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.6);transition:opacity .25s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .circle .check svg{width:42%;height:42%;stroke:var(--rose-soft);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .must.done .circle{transform:scale(1);box-shadow:0 0 0 3px var(--rose), 0 12px 28px var(--rose-glow);}
  .must.done .check{opacity:1;transform:scale(1);}
  .must .m-input{
    width:100%;margin-top:11px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 8px;text-align:center;
    color:var(--text);font-family:var(--sans);font-size:12.5px;font-weight:600;outline:none;
  }
  .must .m-input::placeholder{color:var(--muted2);font-weight:400;}
  .must.done .m-input{color:var(--rose-soft);text-decoration:line-through;text-decoration-color:rgba(244,120,159,.5);}
  .must-hint{text-align:center;font-size:11px;color:var(--muted2);margin-bottom:4px;}

  /* ---------- One Thing 강조 ---------- */
  .onething{
    background:linear-gradient(135deg, rgba(244,120,159,.16), rgba(221,203,242,.10));
    border:1px solid rgba(244,120,159,.3);border-radius:16px;padding:15px 16px;
  }
  .onething label{color:var(--rose-soft);}
  .onething input{font-family:var(--serif);font-size:17px;font-weight:700;}

  /* ---------- 응원 ---------- */
  .cheer{background:linear-gradient(135deg,var(--wine),#3a1020);border:1px solid rgba(255,179,201,.18);}
  .cheer label{color:var(--rose-soft);}
  .cheer textarea{font-family:var(--serif);font-size:16px;font-style:italic;}

  /* ---------- 하단 완료 버튼 ---------- */
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(to top, var(--bg) 55%, transparent);
  }
  .bottombar .inner{max-width:440px;margin:0 auto;}
  .btn-done{
    width:100%;border:none;border-radius:16px;padding:17px;cursor:pointer;
    font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:.3px;color:#fff;
    background:linear-gradient(135deg,var(--rose) 0%,#ff6fa3 50%,#e85b95 100%);
    box-shadow:0 12px 30px var(--rose-glow);transition:transform .15s;
  }
  .btn-done:active{transform:scale(.97);}

  /* ---------- 완성 카드 / 받은 카드 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(10,6,12,.82);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px 40px;
  }
  .overlay.show{display:flex;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .card{
    width:100%;max-width:400px;background:
      radial-gradient(120% 50% at 80% 0%, rgba(244,120,159,.18), transparent 60%),
      linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid rgba(255,179,201,.18);border-radius:24px;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.6);position:relative;
    animation:pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1)}}
  .card .stamp{
    position:absolute;top:18px;right:-44px;transform:rotate(12deg);
    background:var(--rose);color:#3a0e1f;font-weight:800;font-size:10px;letter-spacing:1.5px;
    padding:6px 52px;box-shadow:0 6px 16px var(--rose-glow);
  }
  .card .c-head{padding:26px 24px 20px;border-bottom:1px solid var(--line);}
  .c-gift{font-size:11px;color:var(--rose-soft);font-weight:700;margin-bottom:6px;}
  .c-title{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .c-date{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .c-body{padding:6px 24px 22px;}
  .c-block{padding:16px 0;border-bottom:1px dashed var(--line);}
  .c-block:last-child{border-bottom:none;}
  .c-label{font-size:11px;color:var(--rose-soft);font-weight:700;letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
  .c-must{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:14.5px;font-weight:600;}
  .c-must .dot{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px;}
  .c-must.ok .dot{background:var(--rose);color:#3a0e1f;font-weight:800;}
  .c-must.no .dot{border:1.5px solid var(--muted2);color:transparent;}
  .c-must.ok span{color:var(--text);}
  .c-must.no span{color:var(--muted);}
  .c-line{font-size:14px;color:var(--text);line-height:1.6;}
  .c-line .k{color:var(--muted);font-weight:600;margin-right:7px;}
  .c-one{font-family:var(--serif);font-size:19px;font-weight:800;color:#fff;line-height:1.4;}
  .c-cheer{
    font-family:var(--serif);font-size:16px;font-style:italic;color:var(--rose-soft);
    text-align:center;line-height:1.6;padding:18px 16px;
    background:linear-gradient(135deg,rgba(75,21,40,.5),rgba(58,16,32,.3));
    border-radius:14px;margin-top:4px;
  }
  .c-foot{text-align:center;font-size:10.5px;color:var(--muted2);padding:14px;letter-spacing:.3px;}

  .card-actions{max-width:400px;width:100%;margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .ca-btn{
    border:none;border-radius:14px;padding:15px;font-family:var(--sans);font-size:14.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;
  }
  .ca-btn:active{transform:scale(.97);}
  .ca-primary{background:linear-gradient(135deg,var(--rose),#e85b95);color:#fff;box-shadow:0 10px 26px var(--rose-glow);}
  .ca-ghost{background:var(--card);color:var(--text);border:1px solid var(--line);}
  .ca-text{background:transparent;color:var(--muted);font-size:13px;}

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--rose);color:#3a0e1f;font-weight:700;font-size:13.5px;
    padding:13px 22px;border-radius:999px;box-shadow:0 12px 30px var(--rose-glow);
    opacity:0;pointer-events:none;transition:all .3s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .received-banner{
    background:linear-gradient(135deg,var(--rose),#ff9ebd);color:#3a0e1f;
    text-align:center;font-size:12.5px;font-weight:700;padding:10px;border-radius:12px;margin-bottom:14px;
  }
</style>
</head>
<body>

<!-- ====== 입력 화면 ====== -->
<div class="wrap pt-safe" id="inputView">
  <div class="header" style="margin-top:6px">
    <div class="brand">금원아의 내일<br><span class="sub">— 내일 계획 · 성장 기록 —</span></div>
    <div class="datebar">
      <span class="ico">📅</span>
      <input type="date" id="f_date" class="date-input">
    </div>
  </div>

  <!-- 기상 / 출근 -->
  <div class="sec">
    <div class="sec-h"><span class="emo">🕘</span><h2>기상 / 출근</h2></div>
    <div class="row2">
      <div class="field"><label>기상</label><input type="time" id="f_wake" class="txt"></div>
      <div class="field"><label>출근</label><input type="time" id="f_out" class="txt"></div>
    </div>
  </div>

  <!-- 시간 계획 -->
  <div class="sec">
    <div class="sec-h"><span class="emo">⏰</span><h2>내일 시간 계획 <span style="color:var(--muted2);font-weight:500;font-size:12px">(크게)</span></h2></div>
    <div class="field"><label>오전</label><input id="f_am" class="txt" placeholder="예) 회사업무, 경제강의"></div>
    <div class="field"><label>오후</label><input id="f_pm" class="txt" placeholder="예) 퇴근, 딸 하원"></div>
    <div class="field"><label>저녁</label><input id="f_eve" class="txt" placeholder="예) 쓰레드 작성, 유튜브 제목 10개"></div>
  </div>

  <!-- MUST 3 (히어로) -->
  <div class="sec">
    <div class="sec-h"><span class="emo">✅</span><h2>꼭 해야 할 것</h2><span class="tag">Must 3 · 탭하면 체크</span></div>
    <p class="must-hint">동그라미를 누르면 완료 표시돼요 ✓</p>
    <div class="must-wrap">
      <div class="must" data-must="0">
        <div class="circle" onclick="toggleMust(0)"><span class="num">1</span>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></div></div>
        <input class="m-input" id="must0" placeholder="첫 번째">
      </div>
      <div class="must" data-must="1">
        <div class="circle" onclick="toggleMust(1)"><span class="num">2</span>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></div></div>
        <input class="m-input" id="must1" placeholder="두 번째">
      </div>
      <div class="must" data-must="2">
        <div class="circle" onclick="toggleMust(2)"><span class="num">3</span>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></svg></div></div>
        <input class="m-input" id="must2" placeholder="세 번째">
      </div>
    </div>
  </div>

  <!-- Nice -->
  <div class="sec">
    <div class="sec-h"><span class="emo">🌿</span><h2>하면 좋은 것</h2><span class="tag">Nice</span></div>
    <div class="field"><input id="f_nice1" class="txt" placeholder="예) 산책"></div>
    <div class="field"><input id="f_nice2" class="txt" placeholder="여유가 되면"></div>
    <div class="field"><input id="f_nice3" class="txt" placeholder="여유가 되면"></div>
  </div>

  <!-- 변수 -->
  <div class="sec">
    <div class="sec-h"><span class="emo">❗</span><h2>내일의 변수 / 주의할 점</h2></div>
    <div class="field"><textarea id="f_risk" class="txt" rows="2" placeholder="없으면 비워두세요"></textarea></div>
  </div>

  <!-- Small Win -->
  <div class="sec">
    <div class="sec-h"><span class="emo">🏆</span><h2>오늘 해낸 것</h2><span class="tag">Small Win</span></div>
    <div class="field"><textarea id="f_win" class="txt" rows="2" placeholder="아주 작은 것이라도 좋아요"></textarea></div>
  </div>

  <!-- Insight -->
  <div class="sec">
    <div class="sec-h"><span class="emo">💡</span><h2>오늘 배운 점</h2><span class="tag">Insight</span></div>
    <div class="field"><textarea id="f_insight" class="txt" rows="2" placeholder="오늘의 한 줄 깨달음"></textarea></div>
  </div>

  <!-- One Thing -->
  <div class="sec">
    <div class="sec-h"><span class="emo">🔥</span><h2>내일의 원씽</h2><span class="tag">One Thing</span></div>
    <div class="field onething"><label>이것 하나만큼은</label><input id="f_one" class="txt" placeholder="내일 단 하나의 핵심"></div>
  </div>

  <!-- 응원 -->
  <div class="sec">
    <div class="sec-h"><span class="emo">💌</span><h2>To. 한 줄 응원</h2></div>
    <div class="field cheer"><label>나에게, 또는 너에게</label><textarea id="f_cheer" class="txt" rows="2" placeholder="너무 힘들 땐 잠시 쉬어도 좋아"></textarea></div>
  </div>
</div>

<!-- 하단 완료 버튼 -->
<div class="bottombar" id="bottombar">
  <div class="inner"><button class="btn-done" onclick="generate()">완료 · 카드 만들기 ✨</button></div>
</div>

<!-- ====== 완성/받은 카드 오버레이 ====== -->
<div class="overlay" id="overlay">
  <div style="width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;">
    <div id="receivedBanner" style="display:none;width:100%;"></div>
    <div class="card" id="card"></div>
    <div class="card-actions" id="cardActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const mustDone = [false,false,false];

/* ---------- 유니코드 안전 base64 ---------- */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));

/* ---------- 날짜 ---------- */
function todayStr(){
  const d=new Date(); const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function prettyDate(s){
  if(!s) return '';
  const [y,m,d]=s.split('-'); const days=['일','월','화','수','목','금','토'];
  const w=days[new Date(s).getDay()];
  return `${y}. ${Number(m)}. ${Number(d)} (${w})`;
}

/* ---------- Must 토글 ---------- */
function toggleMust(i){
  mustDone[i]=!mustDone[i];
  document.querySelector(`.must[data-must="${i}"]`).classList.toggle('done',mustDone[i]);
  save();
}

/* ---------- 토스트 ---------- */
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ---------- 데이터 수집 ---------- */
function collect(){
  return {
    date:$('f_date').value, wake:$('f_wake').value, out:$('f_out').value,
    am:$('f_am').value, pm:$('f_pm').value, eve:$('f_eve').value,
    must:[$('must0').value,$('must1').value,$('must2').value],
    mustDone:[...mustDone],
    nice:[$('f_nice1').value,$('f_nice2').value,$('f_nice3').value],
    risk:$('f_risk').value, win:$('f_win').value, insight:$('f_insight').value,
    one:$('f_one').value, cheer:$('f_cheer').value
  };
}

/* ---------- 로컬 저장 ---------- */
function save(){ try{ localStorage.setItem('kumwon_'+$('f_date').value, JSON.stringify(collect())); }catch(e){} }
function load(date){
  try{ const raw=localStorage.getItem('kumwon_'+date); if(!raw) return; const d=JSON.parse(raw); fill(d); }catch(e){}
}
function fill(d){
  $('f_date').value=d.date||todayStr(); $('f_wake').value=d.wake||''; $('f_out').value=d.out||'';
  $('f_am').value=d.am||''; $('f_pm').value=d.pm||''; $('f_eve').value=d.eve||'';
  (d.must||[]).forEach((v,i)=>{ if($('must'+i)) $('must'+i).value=v||''; });
  (d.mustDone||[]).forEach((v,i)=>{ mustDone[i]=!!v; document.querySelector(`.must[data-must="${i}"]`).classList.toggle('done',!!v); });
  $('f_nice1').value=(d.nice||[])[0]||''; $('f_nice2').value=(d.nice||[])[1]||''; $('f_nice3').value=(d.nice||[])[2]||'';
  $('f_risk').value=d.risk||''; $('f_win').value=d.win||''; $('f_insight').value=d.insight||'';
  $('f_one').value=d.one||''; $('f_cheer').value=d.cheer||'';
}

/* ---------- 카드 렌더 ---------- */
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderCard(d, received){
  const must = d.must.map((t,i)=> t.trim() ? `<div class="c-must ${d.mustDone[i]?'ok':'no'}"><span class="dot">✓</span><span>${esc(t)}</span></div>` : '').join('');
  const nice = d.nice.filter(x=>x.trim()).map(x=>`<div class="c-line">· ${esc(x)}</div>`).join('');
  const time = [['오전',d.am],['오후',d.pm],['저녁',d.eve]].filter(x=>x[1].trim())
      .map(x=>`<div class="c-line"><span class="k">${x[0]}</span>${esc(x[1])}</div>`).join('');
  const blocks=[];
  if(d.wake||d.out) blocks.push(`<div class="c-block"><div class="c-label">🕘 기상 · 출근</div><div class="c-line">${d.wake?'기상 '+d.wake:''}${d.wake&&d.out?'  ·  ':''}${d.out?'출근 '+d.out:''}</div></div>`);
  if(time) blocks.push(`<div class="c-block"><div class="c-label">⏰ 시간 계획</div>${time}</div>`);
  if(must) blocks.push(`<div class="c-block"><div class="c-label">✅ 꼭 해야 할 것 (Must 3)</div>${must}</div>`);
  if(nice) blocks.push(`<div class="c-block"><div class="c-label">🌿 하면 좋은 것</div>${nice}</div>`);
  if(d.risk.trim()) blocks.push(`<div class="c-block"><div class="c-label">❗ 변수 / 주의</div><div class="c-line">${esc(d.risk)}</div></div>`);
  if(d.win.trim()) blocks.push(`<div class="c-block"><div class="c-label">🏆 오늘 해낸 것</div><div class="c-line">${esc(d.win)}</div></div>`);
  if(d.insight.trim()) blocks.push(`<div class="c-block"><div class="c-label">💡 오늘 배운 점</div><div class="c-line">${esc(d.insight)}</div></div>`);
  if(d.one.trim()) blocks.push(`<div class="c-block"><div class="c-label">🔥 내일의 원씽</div><div class="c-one">${esc(d.one)}</div></div>`);
  if(d.cheer.trim()) blocks.push(`<div class="c-block"><div class="c-cheer">"${esc(d.cheer)}"</div></div>`);

  $('card').innerHTML = `
    <div class="stamp">AUTO-GENERATED</div>
    <div class="c-head">
      <div class="c-gift">♡ 금원아의 내일</div>
      <div class="c-title">내일 계획 · 성장 기록</div>
      <div class="c-date">📅 ${prettyDate(d.date)}</div>
    </div>
    <div class="c-body">${blocks.join('')}</div>
    <div class="c-foot">금원아의 내일 · 매일 한 걸음씩</div>`;
}

/* ---------- 완료 → 카드 ---------- */
function generate(){
  const d=collect();
  const filled = d.must.some(x=>x.trim())||d.am||d.pm||d.eve||d.one.trim();
  if(!filled){ toast('내일 계획을 조금만 채워주세요 🌱'); return; }
  save();
  renderCard(d,false);
  $('receivedBanner').style.display='none';
  $('cardActions').innerHTML = `
    <button class="ca-btn ca-primary" onclick="shareLink()">🔗 공유 링크 복사</button>
    <button class="ca-btn ca-ghost" onclick="capHint()">📸 이미지로 저장하기</button>
    <button class="ca-btn ca-text" onclick="closeCard()">← 돌아가서 수정</button>`;
  $('overlay').classList.add('show');
  $('overlay').scrollTop=0;
}

function shareLink(){
  const link = location.href.split('#')[0] + '#card=' + enc(collect());
  if(navigator.share){
    navigator.share({title:'금원아의 내일', text:'내일 계획 · 성장 기록', url:link}).catch(()=>copy(link));
  } else copy(link);
}
function copy(text){
  navigator.clipboard?.writeText(text).then(()=>toast('공유 링크가 복사됐어요 ✨'))
    .catch(()=>{ prompt('이 링크를 복사하세요',text); });
}
function capHint(){ toast('카드를 길게 눌러 저장하거나 캡처하세요 📸'); }
function closeCard(){ $('overlay').classList.remove('show'); }

/* ---------- 받은 카드(공유 링크) ---------- */
function showReceived(d){
  renderCard(d,true);
  $('receivedBanner').innerHTML = `<div class="received-banner">♡ 금원아 대표님이 보낸 내일 계획이에요</div>`;
  $('receivedBanner').style.display='block';
  $('cardActions').innerHTML = `
    <button class="ca-btn ca-primary" onclick="startMine()">나도 내일 계획 만들기 ✨</button>
    <button class="ca-btn ca-text" onclick="capHint()">📸 이 카드 저장하기</button>`;
  $('overlay').classList.add('show');
}
function startMine(){ history.replaceState(null,'',location.pathname); $('overlay').classList.remove('show'); }

/* ---------- 초기화 ---------- */
(function init(){
  // 공유 링크로 들어온 경우
  const h=location.hash;
  if(h.startsWith('#card=')){
    try{ showReceived(dec(h.slice(6))); }catch(e){}
  }
  // 입력 화면 기본 세팅
  $('f_date').value=todayStr();
  load(todayStr());
  $('f_date').addEventListener('change',()=>{ 
    document.querySelectorAll('.must').forEach((m,i)=>{mustDone[i]=false;m.classList.remove('done');});
    ['f_wake','f_out','f_am','f_pm','f_eve','must0','must1','must2','f_nice1','f_nice2','f_nice3','f_risk','f_win','f_insight','f_one','f_cheer'].forEach(id=>$(id).value='');
    load($('f_date').value);
  });
  // 자동 저장
  document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',save));
})();
</script>
</body>
</html>
